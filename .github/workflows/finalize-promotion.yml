name: Finalize Promotion

on:
  workflow_dispatch:

  pull_request:
    types:
      - closed

permissions:
  pull-requests: write
  issues: write

jobs:

  finalize:

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'master'
      )

    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:

      - name: Debug PR Body
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "===== PR BODY ====="
          echo "${{ github.event.pull_request.body }}"
          echo "==================="

      - name: Extract Source PRs
        if: github.event_name != 'workflow_dispatch'
        run: |

          BODY='${{ github.event.pull_request.body }}'

          SOURCE_PRS=$(echo "$BODY" \
            | grep -oE 'source-prs=[0-9,]+' \
            | cut -d= -f2)

          echo "SOURCE_PRS=$SOURCE_PRS"

          echo "SOURCE_PRS=$SOURCE_PRS" >> $GITHUB_ENV

      - name: Validate Source PRs
        if: github.event_name != 'workflow_dispatch'
        run: |

          if [ -z "$SOURCE_PRS" ]; then
            echo "ERROR: No source PRs found in promotion PR."
            exit 1
          fi

      #
      # Manual cleanup support
      #
      - name: Manual Cleanup Setup
        if: github.event_name == 'workflow_dispatch'
        run: |

          #
          # Replace with actual PRs if needed
          #
          echo "SOURCE_PRS=11,7,6" >> $GITHUB_ENV

      - name: Update Labels
        run: |

          echo "Updating PRs: $SOURCE_PRS"

          for PR in $(echo "$SOURCE_PRS" | tr ',' ' ')
          do

            echo "================================"
            echo "Processing PR #$PR"
            echo "================================"

            gh api \
              repos/${{ github.repository }}/issues/$PR/labels/queued-for-master \
              -X DELETE || true

            gh api \
              repos/${{ github.repository }}/issues/$PR/labels/promote-to-master \
              -X DELETE || true

            gh api \
              repos/${{ github.repository }}/issues/$PR/labels \
              --method POST \
              -f labels[]=promoted-to-master
              
            if [ "${{ github.event_name }}" = "pull_request" ]; then

              gh api \
                repos/${{ github.repository }}/issues/$PR/comments \
                --method POST \
                -f body="✅ Successfully promoted to master through Promotion PR #${{ github.event.pull_request.number }}"

            else

              gh api \
                repos/${{ github.repository }}/issues/$PR/comments \
                --method POST \
                -f body="✅ Labels updated manually using Finalize Promotion workflow."

            fi

          done

      - name: Verify Labels Updated
        run: |

          echo "Processed PRs: $SOURCE_PRS"